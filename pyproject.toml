[project]
  name            = "tunnel-probe"
  version         = "0.1.0"
  description     = "The test spoke of the WireGuard tunnel: proves fetched mode, enrolment and the handshake end to end"
  readme          = "README.md"
  requires-python = ">=3.14"
  dependencies    = []

  [project.scripts]
    run-app-tunnel-probe = "tunnel_probe.__main__:run_app"

[dependency-groups]
  dev = ["aeth-devkit>=15.1.1"]

[build-system]
  requires      = ["uv_build>=0.11.2,<0.12.0"]
  build-backend = "uv_build"

[tool.docker]
  services                = ["tunnel-probe"]
  required_persisted_dirs = ["persisted_data"]
  wireguard               = true

[tool.poe]
  include_script = [{ script = "aeth_devkit:tasks", executor = { type = "uv", frozen = true } }]

[tool.uv]
  [tool.uv.sources]
    aeth-devkit         = [{ index = "SFTPyPI" }]
    devkit-templates    = [{ index = "SFTPyPI" }]
    devkit-container    = [{ index = "SFTPyPI" }]
    devkit-claude-hooks = [{ index = "SFTPyPI" }]
    devkit-poe-complete = [{ index = "SFTPyPI" }]
    aeth-ext            = [{ index = "SFTPyPI" }]

  [[tool.uv.index]]
    name        = "SFTPyPI"
    url         = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/+simple"
    publish-url = "https://pypi.sweetfiretobacco.com/jacob.ogden/internal/"
    explicit    = true
